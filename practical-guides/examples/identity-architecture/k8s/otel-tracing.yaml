apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-tracing
  namespace: agents
data:
  tracing.py: |
    import base64
    import json
    import os
    import threading
    import time
    import urllib.request
    import uuid

    COLLECTOR_ENDPOINT = os.environ.get(
        "OTEL_COLLECTOR_ENDPOINT",
        "http://otel-collector.rossoctl-system.svc.cluster.local:8335",
    )
    SERVICE_NAME = os.environ.get("OTEL_SERVICE_NAME", "unknown")

    SPAN_KIND_SERVER = 2
    SPAN_KIND_CLIENT = 3
    STATUS_OK = 1
    STATUS_ERROR = 2


    def _hex(n_bytes):
        return uuid.uuid4().hex[: n_bytes * 2]


    def parse_traceparent(header):
        if not header:
            return None
        parts = header.split("-")
        if len(parts) != 4 or parts[0] != "00":
            return None
        return {"trace_id": parts[1], "parent_span_id": parts[2], "flags": parts[3]}


    def make_traceparent(trace_id, span_id, flags="01"):
        return f"00-{trace_id}-{span_id}-{flags}"


    class Span:
        def __init__(self, name, trace_id=None, parent_span_id=None, kind=SPAN_KIND_SERVER):
            self.name = name
            self.trace_id = trace_id or _hex(16)
            self.span_id = _hex(8)
            self.parent_span_id = parent_span_id or ""
            self.kind = kind
            self.attributes = {}
            self.start_ns = time.time_ns()
            self.end_ns = None
            self.status_code = STATUS_OK
            self.events = []

        def set_attribute(self, key, value):
            self.attributes[key] = value

        def set_error(self, message):
            self.status_code = STATUS_ERROR
            self.events.append({
                "name": "exception",
                "timeUnixNano": str(time.time_ns()),
                "attributes": [{"key": "exception.message", "value": {"stringValue": str(message)}}],
            })

        def end(self):
            self.end_ns = time.time_ns()

        def traceparent(self):
            return make_traceparent(self.trace_id, self.span_id)

        def to_otlp(self):
            attrs = []
            for k, v in self.attributes.items():
                if isinstance(v, bool):
                    attrs.append({"key": k, "value": {"boolValue": v}})
                elif isinstance(v, int):
                    attrs.append({"key": k, "value": {"intValue": str(v)}})
                elif isinstance(v, float):
                    attrs.append({"key": k, "value": {"doubleValue": v}})
                else:
                    attrs.append({"key": k, "value": {"stringValue": str(v)}})
            span = {
                "traceId": self.trace_id,
                "spanId": self.span_id,
                "name": self.name,
                "kind": self.kind,
                "startTimeUnixNano": str(self.start_ns),
                "endTimeUnixNano": str(self.end_ns or time.time_ns()),
                "attributes": attrs,
                "status": {"code": self.status_code},
            }
            if self.parent_span_id:
                span["parentSpanId"] = self.parent_span_id
            if self.events:
                span["events"] = self.events
            return span


    def parse_jwt_claims(auth_header):
        if not auth_header or not auth_header.startswith("Bearer "):
            return None
        token = auth_header[7:]
        try:
            payload = token.split(".")[1]
            payload += "=" * (4 - len(payload) % 4)
            return json.loads(base64.urlsafe_b64decode(payload))
        except Exception:
            return None


    def set_auth_attributes(span, auth_header):
        claims = parse_jwt_claims(auth_header)
        if not claims:
            return
        if "sub" in claims:
            span.set_attribute("auth.subject", claims["sub"])
        if "preferred_username" in claims:
            span.set_attribute("auth.username", claims["preferred_username"])
        act = claims.get("act")
        if isinstance(act, dict):
            span.set_attribute("auth.actor", act.get("sub", ""))
            depth = 0
            node = act
            while isinstance(node, dict):
                depth += 1
                node = node.get("act")
            span.set_attribute("auth.delegation_depth", depth)


    def export_spans(spans):
        if not spans:
            return
        body = {
            "resourceSpans": [{
                "resource": {
                    "attributes": [
                        {"key": "service.name", "value": {"stringValue": SERVICE_NAME}},
                    ]
                },
                "scopeSpans": [{
                    "scope": {"name": "a2a.manual"},
                    "spans": [s.to_otlp() for s in spans],
                }],
            }]
        }

        def _send():
            try:
                req = urllib.request.Request(
                    f"{COLLECTOR_ENDPOINT}/v1/traces",
                    data=json.dumps(body).encode(),
                    headers={"Content-Type": "application/json"},
                )
                urllib.request.urlopen(req, timeout=5)
            except Exception:
                pass

        threading.Thread(target=_send, daemon=True).start()
