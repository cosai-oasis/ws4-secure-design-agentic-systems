apiVersion: v1
kind: ServiceAccount
metadata:
  name: orchestrator-agent-sa
  namespace: agents
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: orchestrator-agentcard-signer
  namespace: agents
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agentcard-signer
subjects:
  - kind: ServiceAccount
    name: orchestrator-agent-sa
    namespace: agents
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-agent-card-unsigned
  namespace: agents
data:
  agent.json: |
    {
      "name": "Orchestrator Agent",
      "description": "Routes requests to specialized peer agents using LLM-based intent classification",
      "url": "http://orchestrator-agent.agents.svc.cluster.local:8080",
      "version": "1.0.0",
      "capabilities": {
        "streaming": false,
        "pushNotifications": false
      },
      "defaultInputModes": ["text/plain"],
      "defaultOutputModes": ["text/plain"],
      "skills": [
        {
          "name": "route_request",
          "description": "Analyzes user requests and delegates to the most appropriate peer agent",
          "inputModes": ["text/plain"],
          "outputModes": ["text/plain"]
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: orchestrator-peers
  namespace: agents
data:
  peers.json: |
    [
      {
        "name": "weather-agent",
        "url": "http://weather-agent.agents.svc.cluster.local:8080",
        "description": "Provides weather forecasts and current conditions for any location"
      }
    ]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-agent
  namespace: agents
  labels:
    app.kubernetes.io/name: orchestrator-agent
    protocol.rossoctl.io/a2a: ""
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orchestrator-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orchestrator-agent
        protocol.rossoctl.io/a2a: ""
        istio.io/dataplane-mode: none
    spec:
      serviceAccountName: orchestrator-agent-sa
      initContainers:
        - name: sign-agentcard
          image: ghcr.io/rossoctl/operator/agentcard-signer:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///run/spire/agent-sockets/spire-agent.sock
            - name: UNSIGNED_CARD_PATH
              value: /etc/agentcard/agent.json
            - name: AGENT_CARD_PATH
              value: /app/.well-known/agent-card.json
            - name: SIGN_TIMEOUT
              value: "30s"
            - name: AGENT_NAME
              value: orchestrator-agent
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: spire-agent-socket
              mountPath: /run/spire/agent-sockets
              readOnly: true
            - name: unsigned-card
              mountPath: /etc/agentcard
              readOnly: true
            - name: signed-card
              mountPath: /app/.well-known
          securityContext:
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 32Mi
      containers:
        - name: agent
          image: localhost:5000/orchestrator-agent:latest
          imagePullPolicy: Always
          env:
            - name: OLLAMA_URL
              value: "http://ollama.agents.svc.cluster.local:11434"
            - name: OLLAMA_MODEL
              value: "qwen2.5:0.5b"
            - name: PEERS_FILE
              value: "/etc/peers/peers.json"
            - name: OTEL_COLLECTOR_ENDPOINT
              value: "http://otel-collector.rossoctl-system.svc.cluster.local:8335"
            - name: OTEL_SERVICE_NAME
              value: "orchestrator-agent"
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: signed-card
              mountPath: /app/.well-known
              readOnly: true
            - name: peers
              mountPath: /etc/peers
              readOnly: true
            - name: otel-tracing
              mountPath: /app/tracing.py
              subPath: tracing.py
              readOnly: true
      volumes:
        - name: spire-agent-socket
          csi:
            driver: csi.spiffe.io
            readOnly: true
        - name: unsigned-card
          configMap:
            name: orchestrator-agent-card-unsigned
        - name: signed-card
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: peers
          configMap:
            name: orchestrator-peers
        - name: otel-tracing
          configMap:
            name: otel-tracing
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-agent
  namespace: agents
spec:
  selector:
    app.kubernetes.io/name: orchestrator-agent
  ports:
    - port: 8080
      targetPort: 8080
