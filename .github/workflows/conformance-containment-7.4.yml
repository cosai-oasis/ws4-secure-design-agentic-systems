# Grades the section 7.4 candidate cases in conformance/containment-7.4 with
# agent-evidence-verify, the published verifier requirements.txt pins by hash.
# run.py exits non-zero on any case whose verdict no longer matches its
# expectation, any record whose bytes miss the digest its case pins, any case
# pinned to other text, and a section 7.4 that no longer hashes to the pin.
# The weekly run catches an edit to 7.4 on the paper's branch, which does not
# touch this directory. The run's summary page explains the result to a reader
# who did not build the suite.
name: conformance-containment-7.4

on:
  push:
    branches: [main, feat/containment]
    paths:
      - "conformance/containment-7.4/**"
      - "whitepapers/agent-containment.md"
      - ".github/workflows/conformance-containment-7.4.yml"
  pull_request:
    paths:
      - "conformance/containment-7.4/**"
      - "whitepapers/agent-containment.md"
      - ".github/workflows/conformance-containment-7.4.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  containment-7-4:
    runs-on: ubuntu-24.04
    env:
      CASES: conformance/containment-7.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Find the cases
        id: cases
        run: |
          if [ -f "$CASES/run.py" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No $CASES/run.py on this branch; nothing to grade."
          fi
      # Section 7.4 is drafted on feat/containment. Until the paper lands on
      # the branch under test, read 7.4 from there, so the pin is always checked.
      - name: Find section 7.4
        id: paper
        if: steps.cases.outputs.present == 'true'
        run: |
          if grep -q '^### 7\.4 ' whitepapers/agent-containment.md 2>/dev/null; then
            echo "source=checkout" >> "$GITHUB_OUTPUT"
            echo "path=$GITHUB_WORKSPACE/whitepapers/agent-containment.md" >> "$GITHUB_OUTPUT"
          else
            echo "source=feat/containment" >> "$GITHUB_OUTPUT"
            echo "path=$GITHUB_WORKSPACE/paper/whitepapers/agent-containment.md" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.paper.outputs.source == 'feat/containment'
        with:
          ref: feat/containment
          path: paper
          sparse-checkout: whitepapers/agent-containment.md
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.cases.outputs.present == 'true'
        with:
          python-version: "3.13"
      - name: Install the pinned verifier and corpus
        if: steps.cases.outputs.present == 'true'
        working-directory: ${{ env.CASES }}
        run: python -m pip install --require-hashes -r requirements.txt
      - name: The pinned corpus behaves as its manifest declares
        if: steps.cases.outputs.present == 'true'
        run: agent-evidence-vectors --corpus vectors-observed-effect
      - name: Grade every case against 7.4
        if: steps.cases.outputs.present == 'true'
        working-directory: ${{ env.CASES }}
        run: python run.py --paper "${{ steps.paper.outputs.path }}" --summary "$GITHUB_STEP_SUMMARY"
      - name: Harness regressions
        if: steps.cases.outputs.present == 'true'
        working-directory: ${{ env.CASES }}
        run: python -m unittest test_run
